# Detection Configuration for YOLO11 Symbol Detector (5 Epochs & Batch Size 30)

model:
  name: "yolo11n"              # yolo11n (Nano architecture for high speed)
  weights_path: "models/checkpoints/best.pt"
  pretrained_backbone: "yolo11n.pt"

data:
  dataset_yaml: "data/processed/yolo/dataset.yaml"
  classes_file: "classes.json"
  img_size: 480               # Fast 480x480 resolution
  tile_size: 480
  tile_overlap: 0.2
  use_tiling: false

training:
  epochs: 5                   # 5 fast epochs
  batch_size: 30              # Batch size 30 as requested
  workers: 4
  learning_rate: 0.015        # Accelerated learning rate for 5-epoch convergence
  optimizer: "AdamW"
  patience: 5
  mixed_precision: false
  device: "cpu"
  save_period: 2
  checkpoint_dir: "models/checkpoints"

augmentation:
  degrees: 10.0
  translate: 0.1
  scale: 0.2
  shear: 2.0
  perspective: 0.0005
  fliplr: 0.0
  flipud: 0.0
  mosaic: 0.3
  mixup: 0.05
  hsv_h: 0.015
  hsv_s: 0.2
  hsv_v: 0.2

inference:
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_det: 300
  half: false
  cache_detections: true
  cache_dir: "data/cache/detections"
